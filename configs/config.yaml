# =============================================================================
# CONFIGURATION FILE
# Federated Edge-Based Early Toxicity Detection for Mobile Keyboards
# =============================================================================
#
# Every module reads its settings from this single file.
# This ensures reproducibility and makes it easy to run experiments
# with different hyperparameters.
#
# HOW TO USE: Change any value below and rerun the relevant module.
# No code changes needed.
# =============================================================================

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
project:
  name: "Federated Edge-Based Early Toxicity Detection"
  description: >
    Privacy-preserving early toxicity detection using lightweight
    transformer models and federated learning, simulated for
    mobile keyboard applications.
  version: "1.0.0"
  seed: 42  # Random seed for reproducibility of all randomness
  output_dir: "results"

results:
  plots: "results/plots"
  logs: "results/logs"
  checkpoints: "results/checkpoints"
  reports: "results/reports"

# ---------------------------------------------------------------------------
# Data paths and dataset information
# ---------------------------------------------------------------------------
data:
  raw:
    path: "data/raw"
    train_file: "train.csv"
    test_file: "test.csv"

  processed:
    path: "data/processed"
    train_file: "train_cleaned.csv"
    test_file: "test_cleaned.csv"

  partitions:
    path: "data/partitions"

  # The Jigsaw dataset has 6 toxicity labels.
  # Each comment can have MULTIPLE labels simultaneously.
  labels:
    - toxic
    - severe_toxic
    - obscene
    - threat
    - insult
    - identity_hate

  num_labels: 6  # Must match len(labels) above
  max_seq_length: 256  # Max tokens per comment (DistilBERT: 512 max)

# ---------------------------------------------------------------------------
# Text preprocessing settings
# ---------------------------------------------------------------------------
preprocessing:
  remove_urls: true
  remove_mentions: true
  lowercase: true
  normalize_whitespace: true
  normalize_emoji: true
  remove_duplicates: true

# ---------------------------------------------------------------------------
# Model configuration
# ---------------------------------------------------------------------------
model:
  name: "distilbert-base-uncased"
  num_labels: 6
  dropout: 0.1
  cache_dir: "models/cache"
  use_atam: false  # Set true to use ATAM (Adaptive Toxic Attention Module)

# ---------------------------------------------------------------------------
# Centralized training hyperparameters
# ---------------------------------------------------------------------------
training:
  batch_size: 32
  learning_rate: 0.00002  # 2e-5
  epochs: 6
  weight_decay: 0.01  # L2 regularization to prevent overfitting
  warmup_steps: 500    # Gradually increase LR at start
  gradient_clip: 1.0   # Clip gradients to prevent explosion
  evaluation_strategy: "epoch"
  save_strategy: "epoch"
  logging_steps: 100
  early_stopping_patience: 2  # Stop if no val F1-macro improvement for this many epochs

# ---------------------------------------------------------------------------
# Personalization (LoRA)
# ---------------------------------------------------------------------------
personalization:
  method: "none"            # "lora" to inject LoRA. Module 5 (FedPref) overrides this automatically.
  lora_r: 8                  # LoRA rank
  lora_alpha: 16             # LoRA scaling factor
  lora_dropout: 0.1
  lora_modules: ["q_lin", "v_lin"]  # Attention projections to adapt

# ---------------------------------------------------------------------------
# Federated learning settings
# ---------------------------------------------------------------------------
federated:
  num_clients: 10        # Number of simulated mobile clients
  num_rounds: 25         # Communication rounds between server and clients
  fraction_fit: 1.0      # Fraction of clients participating each round
  min_fit_clients: 10    # Minimum clients for a round to proceed
  min_available_clients: 10
  local_epochs: 1        # Epochs each client trains locally
  iid: true              # true = IID partition, false = Non-IID
  alpha: 0.5             # Dirichlet parameter for non-IID distribution
  server_address: "0.0.0.0:8080"
  strategy: "fedavg"     # Federated Averaging algorithm

# ---------------------------------------------------------------------------
# Module 0: Offline LLM teacher pass (evidence-anchored supervision)
# ---------------------------------------------------------------------------
# The teacher reads the FULL comment once and produces, per label:
#   1. soft_targets (0-1 confidence)      -> the "final decision"
#   2. evidence spans (char offsets)      -> define the ANCHOR position
# Both are cached to disk, so the 3B model is only run once (Module 0).
llm:
  teacher: "meta-llama/Llama-3.2-3B-Instruct"
  cache_dir: "models/cache"        # HF model cache (reused across modules)
  mock: false                      # true = deterministic fake spans (smoke test)
  subsample_size: 25000            # stratified: all toxic + balanced clean
  stratify_toxic: true
  span_only: true                  # compact JSON prompt = cheaper generation
  temperature: 1.0                 # teacher soft-target temperature
  generation_max_new_tokens: 220
  batch_size: 16                   # teacher generation batch
  flush_batches: 10                # cache shard flush cadence
  max_minutes: 300                 # wall-clock budget for an interrupted session
  output_dir: "results/llm_cache"  # teacher cache (soft targets + spans)

# Typing-faithful prefix bank (re-tokenized char prefixes, from Module 0)
prefix:
  fractions: [0.25, 0.5, 0.75, 1.0]
  include_anchor: true             # add a cut exactly at the anchor char
  output_dir: "results/prefix_cache"

# ---------------------------------------------------------------------------
# Kaggle session budgets & cross-session resume
# ---------------------------------------------------------------------------
sessions:
  snapshot: true                   # try to publish results/ as a Kaggle dataset
  snapshot_slug: "toxic-early-detection-llm"
  teacher_budget_min: 300          # Module 0 budget (same as llm.max_minutes)
  train_budget_min: 300            # Module 3 anchored-training budget
  fl_budget_min: 480               # Module 5 federated/DP budget

# ---------------------------------------------------------------------------
# Evaluation and early detection
# ---------------------------------------------------------------------------
evaluation:
  warning_threshold: 0.7   # Probability above which we flag as toxic
  early_detection: true     # Enable prefix-based (while-typing) detection
  prefix_increment: 1       # Character increment for prefix sliding window
  metrics:
    - accuracy
    - precision
    - recall
    - f1_macro
    - f1_micro
    - roc_auc
    - hamming_loss
    - subset_accuracy

# ---------------------------------------------------------------------------
# Model optimization (quantization)
# ---------------------------------------------------------------------------
optimization:
  quantize: false
  # Options: "dynamic", "static", "qat" (quantization-aware training)
  quantization_type: "dynamic"

# ---------------------------------------------------------------------------
# Interactive simulation
# ---------------------------------------------------------------------------
simulation:
  framework: "streamlit"
  port: 8501
  host: "0.0.0.0"

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
